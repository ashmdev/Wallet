[package]
name = "velox-ledger"
version = "0.1.0"
edition = "2021"
authors = ["VeloxLedger Team"]
description = "High-performance transactional ledger microservice with double-entry accounting"
license = "MIT"
rust-version = "1.80"

[dependencies]
# Async Runtime
tokio = { version = "1.43", features = ["full", "tracing"] }

# gRPC
tonic = { version = "0.12", features = ["gzip", "tls"] }
prost = "0.13"
prost-types = "0.13"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "migrate"
]}

# Money handling - NEVER use floats for financial calculations
rust_decimal = { version = "1.36", features = ["serde", "serde-with-str", "db-postgres"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# UUID for identifiers
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client for webhooks
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async channel for webhook dispatcher
async-channel = "2.3"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
